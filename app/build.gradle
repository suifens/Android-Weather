    buildTypes {
        release {
//            zipAlignEnabled true
//            shrinkResources true
            minifyEnabled true
            signingConfig signingConfigs.config
            buildConfigField 'boolean', 'DEBUG_MODE', 'false'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled true
            signingConfig signingConfigs.config
            buildConfigField 'boolean', 'DEBUG_MODE', 'true'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
    }

    def fileArray = []
    // 自定义APK安装包名
    android.applicationVariants.all {
        variant ->
            variant.outputs.all {
//                outputFileName = "${defaultConfig.applicationId}-${getTime()}.apk"
                outputFileName = "${defaultConfig.applicationId}-${variant.productFlavors[0].name}-v${defaultConfig.versionName}.apk"
            }
    }

    build {
        //build命令加入这段代码
        doLast() {
            //遍历文件数组并进行操作
            outforEachFile(fileArray)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        viewBinding true
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
}

dependencies {

    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')

    implementation project(':weatherlib')
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    //  下拉刷新控件
    implementation 'com.scwang.smartrefresh:SmartRefreshLayout:1.1.3'
    //  room
    implementation 'com.google.dagger:hilt-android:2.52'
    kapt 'com.google.dagger:hilt-compiler:2.52'
    kapt 'androidx.room:room-compiler:2.6.1'

    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.20'

    //  原生定位（LocationKit）源码已内置到 app/src/main/java/com/wkq/location


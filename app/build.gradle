apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'com.huawei.agconnect'

android {
    dataBinding {
        enabled true
    }

    signingConfigs {
        config {
            keyAlias 'weather'
            keyPassword 'Tq123456'
            storeFile file('../archive/weather.jks')
            storePassword 'Tq123456'
        }
    }

    compileSdkVersion 32

    defaultConfig {
        applicationId "com.goodtech.tq"
        minSdkVersion 19
        targetSdkVersion 32
        versionCode 860
        versionName "8.6.0"
        signingConfig signingConfigs.config
        multiDexEnabled true

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        ndk {
            //选择要添加的对应 cpu 类型的 .so 库。
            abiFilters 'armeabi', 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }

        manifestPlaceholders = [
                JPUSH_PKGNAME: applicationId,
                JPUSH_APPKEY : "e2416540f4d3f0081fbef6df", //JPush 上注册的包名对应的 Appkey.
                JPUSH_CHANNEL : "developer-default", //暂时填写默认值即可.
                MEIZU_APPKEY : "MZ-3465e4112e2141f6b1438a648a5f6670",
                MEIZU_APPID : "MZ-146740",
                XIAOMI_APPID : "MI-2882303761517596193",
                XIAOMI_APPKEY : "MI-5321759614193",
                OPPO_APPKEY : "OP-86qoYufhhbWG84k0gkg0SScc0",
                OPPO_APPID : "OP-3574478",
                OPPO_APPSECRET : "OP-254Ebdc6DA2c044f855c2EebC89041f",
                VIVO_APPKEY : "af805fb3b61c6f4daf4e082c506b6275",
                VIVO_APPID : "100111470"
        ]
    }

    flavorDimensions "default"
    productFlavors {
        xiaomi {
            buildConfigField 'int', 'BAIDU_CHANNEL', '10'
            manifestPlaceholders=[app_name:"天气预报", umeng_channel:"xiaomi"]
        }
        huawei {
            buildConfigField 'int', 'BAIDU_CHANNEL', '8'
            manifestPlaceholders=[app_name:"天气预报纯净版", umeng_channel:"huawei"]
        }
        oppo {
            buildConfigField 'int', 'BAIDU_CHANNEL', '6'
            manifestPlaceholders=[app_name:"预知天气预报精准天气", umeng_channel:"oppo"]
        }
        vivo {
            buildConfigField 'int', 'BAIDU_CHANNEL', '7'
            manifestPlaceholders=[app_name:"预知天气预报", umeng_channel:"vivo"]
        }
        yyb {
            buildConfigField 'int', 'BAIDU_CHANNEL', '9'
            manifestPlaceholders=[app_name:"天气预报", umeng_channel:"yyb"]
        }
        meizu {
            buildConfigField 'int', 'BAIDU_CHANNEL', '13'
            manifestPlaceholders=[app_name:"天气预报-天气", umeng_channel:"meizu"]
        }
        sougou {
            buildConfigField 'int', 'BAIDU_CHANNEL', '4'
            manifestPlaceholders=[app_name:"预知天气预报纯净天气", umeng_channel:"sougou"]
        }
        anzhi {
            buildConfigField 'int', 'BAIDU_CHANNEL', '999'
            manifestPlaceholders=[app_name:"预知天气预报苹果纯净版", umeng_channel:"anzhi"]
        }
        wdj {
            buildConfigField 'int', 'BAIDU_CHANNEL', '999'
            manifestPlaceholders=[app_name:"天气预报", umeng_channel:"wandoujia"]
        }
        baidu {
            buildConfigField 'int', 'BAIDU_CHANNEL', '1'
            manifestPlaceholders=[app_name:"天气预报", umeng_channel:"baidu"]
        }
//        t360 {
//            buildConfigField 'int', 'BAIDU_CHANNEL', '999'
//            manifestPlaceholders=[app_name:"天气预报", umeng_channel:"360"]
//        }
//        jinli {
//            buildConfigField 'int', 'BAIDU_CHANNEL', '999'
//            manifestPlaceholders=[app_name:"天气预报-天气纯净版", umeng_channel:"jinli"]
//        }
    }

    def fileArray = []
    // 自定义APK安装包名
    android.applicationVariants.all {
        variant ->
            variant.outputs.all {
                outputFileName = "${defaultConfig.applicationId}-${getTime()}.apk"
            }
    }

    build {
        //build命令加入这段代码
        doLast() {
            //遍历文件数组并进行操作
            outforEachFile(fileArray)
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.config
            buildConfigField 'boolean', 'DEBUG_MODE', 'false'
        }
        debug {
            signingConfig signingConfigs.config
            buildConfigField 'boolean', 'DEBUG_MODE', 'true'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

}

static def getTime() {
    return new Date().format("yyMMdd", TimeZone.getDefault())
}


repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.work:work-runtime-ktx:2.7.1'

    implementation fileTree(dir: 'libs', include: '*.jar')
    implementation project(':cropimage')

    implementation 'com.google.android.material:material:1.6.1'
    //noinspection GradleCompatible
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    //noinspection GradleCompatible
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    //noinspection GradleCompatible
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
//    implementation 'org.litepal.android:core:1.4.1'
    //网络加载图片工具
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    // umeng
    //集成示例
    implementation 'com.umeng.umsdk:common:9.4.6'//必选
    implementation 'com.umeng.umsdk:asms:1.5.0'//必选
    //网络请求
    implementation 'com.squareup.okhttp3:okhttp:4.9.1'
    implementation 'com.squareup.okio:okio:2.10.0'
    implementation 'com.google.code.gson:gson:2.9.0'
    //eventbus
    implementation 'org.greenrobot:eventbus:3.3.1'

    implementation 'com.h6ah4i.android.widget.advrecyclerview:advrecyclerview:1.0.0'
    //  下拉刷新控件
    implementation 'com.scwang.smartrefresh:SmartRefreshLayout:1.1.2'
    implementation 'com.nostra13.universalimageloader:universal-image-loader:1.9.5'
//    implementation 'com.tencent.wcdb:wcdb-android:1.0.2'
    implementation 'androidx.multidex:multidex:2.0.1'
    //  适配器BaseRecyclerViewAdapterHelper
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:3.0.4'
    //  android util code
    implementation 'com.blankj:utilcodex:1.31.0'
    //  flex css布局
    implementation 'com.google.android:flexbox:2.0.1'
    //  日历
    implementation 'com.haibin:calendarview:3.7.1'
    //  mmkv存储
    implementation 'com.tencent:mmkv-static:1.2.7'
    //  权限请求
//    implementation 'com.github.tbruyelle:rxpermissions:0.12'
    implementation 'com.tbruyelle.rxpermissions2:rxpermissions:0.9.4@aar'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'

    implementation 'com.github.gzu-liyujiang.AndroidPicker:Common:4.1.7'
    implementation 'com.github.gzu-liyujiang.AndroidPicker:WheelPicker:4.1.7'
    //微信开放平台，登录
    implementation 'com.tencent.mm.opensdk:wechat-sdk-android-with-mta:5.4.0'
    //  相机/相册
    implementation 'io.github.lucksiege:pictureselector:v2.7.3-rc08'

    //  极光推送
    implementation 'cn.jiguang.sdk:jcore:3.3.1'  // 此处以JCore 2.7.2 版本为例。
    implementation 'cn.jiguang.sdk:jpush:4.8.0'  // 此处以JPush 4.0.0 版本为例
    // 接入华为厂商
    implementation 'com.huawei.hms:push:6.5.0.300'
    implementation 'cn.jiguang.sdk.plugin:huawei:4.8.0'// 极光厂商插件版本与接入 JPush 版本保持一致，下同
    // 接入魅族厂商
    implementation 'cn.jiguang.sdk.plugin:meizu:4.8.0'
    // 接入 VIVO 厂商
    implementation 'cn.jiguang.sdk.plugin:vivo:4.8.0'
    // 接入 OPPO 厂商
    implementation 'cn.jiguang.sdk.plugin:oppo:4.8.0'
    implementation(name: 'com.heytap.msp_3.1.0', ext: 'aar')
    //以下为 OPPO 3.1.0 aar需要依赖
//    implementation 'commons-codec:commons-codec:1.9'
//    implementation 'androidx.annotation:annotation:1.1.0'
    // 接入小米厂商
    implementation 'cn.jiguang.sdk.plugin:xiaomi:4.8.0'

    /*GroMore广告显示*/
    //GroMore_sdk
    implementation "com.gromore.cn:gromore-sdk:3.7.0.3"  //groMore sdk
    //GroMore_sdk adapter
    implementation "com.gromore.cn:pangle-adapter:4.8.0.8.2" //穿山甲 adapter
    //pangle
    implementation(name: 'open_ad_sdk_4.8.0.8', ext: 'aar')

    //其中latest.release指代最新Bugly SDK版本号，也可以指定明确的版本号，例如4.0.3
    implementation 'com.tencent.bugly:crashreport:latest.release'

    // <editor-fold defaultstate="collapsed" desc="视频">

    //  必选，内部默认使用系统mediaplayer进行解码
    implementation 'xyz.doikki.android.dkplayer:dkplayer-java:3.3.7'
    //  包含StandardVideoController的实现
    implementation 'xyz.doikki.android.dkplayer:dkplayer-ui:3.3.7'
    //  使用exoplayer进行解码
    implementation 'xyz.doikki.android.dkplayer:player-exo:3.3.7'
    //  可选，如需要缓存或者抖音预加载功能请引入此库
    implementation 'xyz.doikki.android.dkplayer:videocache:3.3.7'

// </editor-fold>

    //  定位功能
    implementation 'com.amap.api:location:latest.integration'

}

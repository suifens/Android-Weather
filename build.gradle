// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        kotlin_version = '2.0.20'
    }
    repositories {
        // 不使用 google()，其默认指向 dl.google.com；仅用镜像
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://mirrors.huaweicloud.com/repository/google/' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
        mavenLocal()
        mavenCentral()

        //GroMore SDK依赖
        maven {
            url "https://artifact.bytedance.com/repository/Volcengine/"
        }
        maven {
            url "https://artifact.bytedance.com/repository/pangle"
        }
        maven {
            url "https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_support/"
        }
        //  增长参谋
        maven {
            url 'https://artifact.bytedance.com/repository/Volcengine/'
        }

        maven {url 'https://developer.huawei.com/repo/'}
        maven { url 'https://jitpack.io' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.12.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // hms
        classpath 'com.huawei.agconnect:agcp:1.8.0.300'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        // 不使用 google()；AndroidX / Lint / Play 等 artifacts 从镜像拉取
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://mirrors.huaweicloud.com/repository/google/' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/jcenter' }
        mavenLocal()
        mavenCentral()

        //hms
        maven { url 'https://developer.huawei.com/repo/' }
        maven { url 'https://jitpack.io' }

        //GroMore SDK依赖
        maven {
            url "https://artifact.bytedance.com/repository/Volcengine/"
        }
        maven {
            url "https://artifact.bytedance.com/repository/pangle"
        }
        //mintegral sdk依赖   引入mintegral sdk需要添加此maven
        maven {
            url "https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_support/"
        }
    }
}

// 无法访问 dl.google.com 时，extractReleaseAnnotations 会拉 lint 全家桶并失败。
// 清空该任务默认行为，仅生成本地占位 typedefs.txt，供 syncReleaseLibJars 使用（内部库无对外注解 API 时一般可接受）。
subprojects { sub ->
    if (sub.name == 'cropimage' || sub.name == 'insaitlib') {
        sub.afterEvaluate {
            sub.tasks.configureEach { task ->
                if (task.name.contains('lintVital')) {
                    task.enabled = false
                }
            }
            sub.tasks.matching { it.name == 'extractReleaseAnnotations' }.configureEach { extractTask ->
                extractTask.actions.clear()
                extractTask.doLast {
                    def typedefDir = new File(sub.buildDir, 'intermediates/annotations_typedef_file/release/extractReleaseAnnotations')
                    typedefDir.mkdirs()
                    def typedefFile = new File(typedefDir, 'typedefs.txt')
                    if (!typedefFile.exists()) {
                        typedefFile.text = ''
                    }
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

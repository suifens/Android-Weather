plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

android {

    namespace 'com.goodtech.weatherlib'
    compileSdk 34

    defaultConfig {
//        applicationId "com.goodtech.weatherlib"
        minSdk 24
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main {
            jniLibs.srcDir 'libs'
        }
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {

    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'

    /*
    这是因为implementation只能用于当前的module,倘若在库中用这种方式设置依赖,我们在app的module就引用不到.但是api或compile可以.
    */
    project.ext.room_version = "2.4.3"
    api "androidx.room:room-runtime:2.6.1"
    api "androidx.room:room-ktx:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"

    project.ext.lifecycle_version = "2.5.1"
    // ViewModel
    api 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6'
    // ViewModel utilities for Compose
    api 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    // LiveData
    api 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.6'
    // optional - helpers for implementing LifecycleOwner in a Service
    api 'androidx.lifecycle:lifecycle-service:2.8.6'

    api 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'

    //  mmkv
    api 'com.tencent:mmkv:1.3.9'
    //  日历
    api 'com.haibin:calendarview:3.7.1'

    api 'com.google.code.gson:gson:2.11.0'
    //  android util code
    api 'com.blankj:utilcodex:1.31.1'
    //管理界面状态库
    api 'com.kingja.loadsir:loadsir:1.3.8'
    //指示器库
    api 'com.github.hackware1993:MagicIndicator:1.7.0'

//    api 'com.guolindev.permissionx:permissionx:1.7.1'

    api 'io.coil-kt:coil:2.7.0'
    api 'io.coil-kt:coil-video:2.7.0'
    api 'io.coil-kt:coil-gif:2.7.0'

    implementation("com.squareup.okhttp3:logging-interceptor:4.12.0")
}